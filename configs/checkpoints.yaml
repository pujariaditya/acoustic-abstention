# The exact training arguments of every released checkpoint, taken from its training.json.
# `python -m aae.train --model <model> --variant <variant>` takes these as its defaults, and scripts/train.sh
# <model> <variant> passes them explicitly (the only way to select hojo-asr-v1/aae-run1 and whisper-large-v3/aae-8500).
# Shared by all: lr 1e-4 (100 warm-up steps, constant), clip 1.0, seed 0, clean_p 0.2, SNR -5..20 dB,
# LoRA alpha = 2 x rank. The variant name selects the objective (see aae/train.py).

